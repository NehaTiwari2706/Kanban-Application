<header class="header">

  <div class="header-left">
    <!-- Page title can go here later -->
  </div>

  <div class="header-right">

    <button class="header-button" type="button" aria-label="Messages">
      <lucide-icon [img]="mailIcon" size="18" strokeWidth="2.2"></lucide-icon>
    </button>

    <button class="header-button" type="button" aria-label="Notifications">
      <lucide-icon [img]="notificationIcon" size="18" strokeWidth="2.2"></lucide-icon>
    </button>

    <div class="profile" aria-label="Profile menu">

      <div class="avatar">
        N
      </div>

      <lucide-icon [img]="chevronIcon" size="16" strokeWidth="2.2" class="arrow"></lucide-icon>

    </div>

  </div>

</header>
